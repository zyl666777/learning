<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5B6B7A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="20" fill="#F7F9FB"/>
  <text x="56" y="76" font-size="30" font-weight="700" fill="#1F2A36">第一步：從關鍵字到機會分數</text>
  <text x="56" y="110" font-size="17" fill="#5B6B7A">先做命令列版本，確認核心邏輯正確，再接上 API 與介面</text>

  <g font-size="20" font-weight="700" fill="#0F4C5C" text-anchor="middle">
    <rect x="56" y="150" width="190" height="110" rx="14" fill="#DDF1F2" stroke="#2E8B94" stroke-width="1.2"/>
    <text x="151" y="198">輸入關鍵字</text>
    <text x="151" y="228" font-size="15" font-weight="400" fill="#3D6670">main.py</text>

    <rect x="276" y="150" width="190" height="110" rx="14" fill="#DDF1F2" stroke="#2E8B94" stroke-width="1.2"/>
    <text x="371" y="198">取前 5 名</text>
    <text x="371" y="228" font-size="15" font-weight="400" fill="#3D6670">serp.py＋Serper API</text>

    <rect x="496" y="150" width="190" height="110" rx="14" fill="#DDF1F2" stroke="#2E8B94" stroke-width="1.2"/>
    <text x="591" y="198">逐頁抓取</text>
    <text x="591" y="228" font-size="15" font-weight="400" fill="#3D6670">crawler.py：字數、日期</text>

    <rect x="716" y="150" width="190" height="110" rx="14" fill="#DDF1F2" stroke="#2E8B94" stroke-width="1.2"/>
    <text x="811" y="198">計算機會分數</text>
    <text x="811" y="228" font-size="15" font-weight="400" fill="#3D6670">scoring.py</text>
  </g>
  <line x1="248" y1="205" x2="272" y2="205" stroke="#5B6B7A" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="468" y1="205" x2="492" y2="205" stroke="#5B6B7A" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="688" y1="205" x2="712" y2="205" stroke="#5B6B7A" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="56" y="296" width="410" height="186" rx="14" fill="#FFFFFF" stroke="#D5DDE5"/>
  <text x="80" y="334" font-size="20" font-weight="700" fill="#1F2A36">爬蟲的禮貌守則</text>
  <g font-size="17" fill="#3A4754">
    <text x="80" y="372">先讀 robots.txt，不允許就不抓</text>
    <text x="80" y="404">每次請求間隔 1.5 秒</text>
    <text x="80" y="436">設定逾時與 User-Agent</text>
    <text x="80" y="468">抓不到就標示原因，流程不中斷</text>
  </g>

  <rect x="496" y="296" width="410" height="186" rx="14" fill="#FFF4E8" stroke="#E8B77A"/>
  <text x="520" y="334" font-size="20" font-weight="700" fill="#7A4A12">每一筆結果最多 20 分</text>
  <g font-size="17" fill="#5C3E17">
    <text x="520" y="372">是論壇討論串</text><text x="882" y="372" text-anchor="end" font-weight="700">+8</text>
    <text x="520" y="404">字數少於 800</text><text x="882" y="404" text-anchor="end" font-weight="700">+6</text>
    <text x="520" y="436">超過 2 年未更新</text><text x="882" y="436" text-anchor="end" font-weight="700">+6</text>
    <text x="520" y="468">5 筆加總，滿分 100，越高越好切入</text>
  </g>

  <text x="56" y="516" font-size="14" fill="#7A8794">未設定 API 金鑰時自動使用示範資料，clone 下來即可執行</text>
</svg>
